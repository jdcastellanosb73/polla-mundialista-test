services:
  api:
    build: ./backend
    container_name: polla-api
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=polla;Username=polla;Password=polla_dev"
      WebOrigin: "http://localhost:5173"
    ports:
      - "5180:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: polla-db
    environment:
      POSTGRES_DB: polla
      POSTGRES_USER: polla
      POSTGRES_PASSWORD: polla_dev
    ports:
      # Host port 5433: avoids colliding with a host-level PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - polla_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polla -d polla"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  polla_pgdata:
